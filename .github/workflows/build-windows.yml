name: build-windows-exe

# 手动触发（Actions 页面 → build-windows-exe → Run workflow），或推送 v* 标签时自动打包
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 打包 exe
        run: pyinstaller medminer.spec --noconfirm --clean

      - name: 自检（验证 exe 是否完整）
        shell: pwsh
        run: |
          Push-Location dist\MedMiner
          $p = Start-Process -FilePath .\MedMiner.exe -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest_result.txt) { Get-Content selftest_result.txt }
          else { Write-Error "没有生成 selftest_result.txt，exe 可能启动失败"; exit 1 }
          if (-not (Select-String -Path selftest_result.txt -Pattern "SELFTEST OK" -Quiet)) { Write-Error "自检未通过"; exit 1 }
          Remove-Item selftest_result.txt
          Pop-Location

      - name: 压缩
        shell: pwsh
        run: Compress-Archive -Path dist\MedMiner -DestinationPath MedMiner-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MedMiner-windows
          path: MedMiner-windows.zip
          retention-days: 30
